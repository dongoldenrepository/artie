<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artie — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      color: #f0ece4;
      font-family: 'Inter', sans-serif;
      padding: 2rem;
      text-align: center;
    }

    .wordmark {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #f0ece4 0%, #c8a96e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: #9a8a74;
      margin-bottom: 3rem;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: #c8a96e;
      margin: 0 auto 3rem;
      opacity: 0.5;
    }

    .message {
      font-size: 1rem;
      color: #8a8078;
      line-height: 1.7;
      max-width: 360px;
    }

    .notify {
      margin-top: 2.5rem;
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 360px;
    }

    .notify input {
      flex: 1;
      padding: 0.65rem 1rem;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      color: #f0ece4;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .notify input:focus { border-color: #c8a96e; }
    .notify input::placeholder { color: #4a4540; }

    .notify button {
      padding: 0.65rem 1.25rem;
      background: #c8a96e;
      color: #0f0f0f;
      border: none;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .notify button:hover { background: #d4b87e; }

    .thanks {
      display: none;
      margin-top: 2.5rem;
      font-size: 0.9rem;
      color: #c8a96e;
    }

    .footer {
      position: absolute;
      bottom: 2rem;
      font-size: 0.75rem;
      color: #3a3530;
    }
  </style>
</head>
<body>
  <div class="wordmark">Artie</div>
  <div class="tagline">Your art. Tracked beautifully.</div>
  <div class="divider"></div>
  <p class="message">A personal catalog for painters, photographers, and visual artists. Coming soon.</p>

  <div class="notify" id="form">
    <input type="email" id="email" placeholder="your@email.com" />
    <button onclick="notify()">Notify me</button>
  </div>
  <div class="thanks" id="thanks">You're on the list. We'll be in touch.</div>

  <div class="footer">trackwithartie.com</div>

  <script>
    function notify() {
      const email = document.getElementById('email').value;
      if (!email || !email.includes('@')) return;
      document.getElementById('form').style.display = 'none';
      document.getElementById('thanks').style.display = 'block';
    }
  </script>
</body>
</html>
